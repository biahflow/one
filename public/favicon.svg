<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="One">
  <!--
    O símbolo do One: o wordmark comprimido até caber num quadrado de 16 px
    (design-approval.md §"Decisions this package carries", item 2; §01 do
    artefato aprovado). Não é uma segunda marca — na tela do produto só aparece
    o wordmark, e o tile fica onde texto não cabe: aba do navegador, atalho de
    tela e o cartão de compartilhamento.

    O quadrado é `.tile--64`: 64 de lado, 18 de raio (o raio de controle na
    proporção do tile), em `--color-brand-500` (#6e56cf). O que saiu daqui foi um
    glifo azul `#68C4FF`, cor que não existe na paleta.

    A inicial é desenhada, e não escrita com `<text>`: um favicon é renderizado
    fora do produto, onde a fonte do produto não está carregada, e um `<text>`
    mudaria de forma em cada sistema. As medidas saíram do "O" da §01 — 27,6 de
    largura por 29,2 de altura, contra-forma de 14 por 18 —, de modo que o
    desenho fica preso ao que foi aprovado em vez de ao que estiver instalado.
  -->
  <rect width="64" height="64" rx="18" fill="#6e56cf"/>
  <path fill="#ffffff" fill-rule="evenodd"
        d="M18.2 32a13.8 14.6 0 1 1 27.6 0 13.8 14.6 0 1 1-27.6 0zm6.8 0a7 9 0 1 0 14 0 7 9 0 1 0-14 0z"/>
</svg>
