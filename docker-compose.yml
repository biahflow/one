services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-portal}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Cria portal_migrator/portal_app/portal_system e transfere a posse do schema
  # (ADR 0010). Roda a cada `up` porque ./infra/postgres/init só é executado em
  # volume novo — este serviço cobre também quem já tem banco criado.
  db-bootstrap:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-portal_local_only}
    volumes:
      - ./infra/postgres/bootstrap:/bootstrap:ro
    command: >
      psql -h postgres -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-portal}
           -v ON_ERROR_STOP=1
           -v app_password=${POSTGRES_APP_PASSWORD:-portal_app_local_only}
           -v system_password=${POSTGRES_SYSTEM_PASSWORD:-portal_system_local_only}
           -v migrator_password=${POSTGRES_MIGRATOR_PASSWORD:-portal_migrator_local_only}
           -v admin_password=${POSTGRES_ADMIN_PASSWORD:-portal_admin_local_only}
           -f /bootstrap/roles.sql
    depends_on:
      postgres:
        condition: service_healthy

  # Aplica as migrações com o papel dono do schema. Antes desta fase nenhum
  # contêiner rodava alembic.
  api-migrate:
    build:
      context: ./apps/api
    restart: "no"
    command: alembic upgrade head
    environment:
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-postgresql+psycopg://portal_migrator:portal_migrator_local_only@postgres:5432/portal}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully

  # Usuários do realm + um projeto vindo de um snapshot Biahflow versionado, para
  # que o login local caia num dashboard real. Idempotente: roda a cada `up`.
  api-seed:
    build:
      context: ./apps/api
    restart: "no"
    command: python -m portal_api.seed
    environment:
      DATABASE_SYSTEM_URL: ${DATABASE_SYSTEM_URL:-postgresql+psycopg://portal_system:portal_system_local_only@postgres:5432/portal}
    depends_on:
      api-migrate:
        condition: service_completed_successfully

  redis:
    image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-portal-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-portal-minio-local-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.1@sha256:be6a86215213145bfb4fb3e2b3ab982a806d00262655abdcf3ffa6a38d241c7c
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local_only}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/portal
      KC_DB_USERNAME: ${POSTGRES_USER:-portal}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-portal_local_only}
      KC_DB_SCHEMA: keycloak
      # O `iss` do token é o endereço que o NAVEGADOR usa. Com o backchannel
      # dinâmico, quem chama de dentro da rede do compose (BFF e API) continua
      # alcançando o Keycloak por `keycloak:8080` sem quebrar o issuer (ADR 0010).
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    # A imagem não tem `curl`; tem `bash`, então falamos HTTP pelo /dev/tcp. O
    # endpoint de saúde vive na porta de gerenciamento (9000), não na 8080.
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "\"status\": \"UP\"" <&3'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.22@sha256:f7f7c31de4de59540ad6515a0ca057a77525bca2069b6e747d873ca66c10fe08
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./apps/api
    environment:
      # Caminho de requisição: papel sujeito à RLS (ADR 0010).
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://portal_app:portal_app_local_only@postgres:5432/portal}
      # Caminho de sistema: webhook e seed, que criam o tenant.
      DATABASE_SYSTEM_URL: ${DATABASE_SYSTEM_URL:-postgresql+psycopg://portal_system:portal_system_local_only@postgres:5432/portal}
      # Caminho de administração: o único que escreve `membership` (ADR 0011).
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-postgresql+psycopg://portal_admin:portal_admin_local_only@postgres:5432/portal}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DEMO_MODE: ${DEMO_MODE:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Qual ambiente é este (ADR 0022). `local` é o único que tolera segredo de
      # exemplo; os outros recusam subir com um deles — ver `_refuse_unsafe`.
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # O `iss` do token é o endereço que o navegador usou; o JWKS é buscado pela
      # rede interna, que é outro host (ADR 0010).
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/portal-local}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/portal-local/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-portal-api}
      # Convite de acesso (ADR 0011): o Admin API do realm, por dentro da rede.
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_ADMIN_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-portal-local}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-portal-admin}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-portal-admin-local-only}
      PORTAL_WEB_URL: ${PORTAL_WEB_URL:-http://localhost:3000}
      # Notificações por e-mail (ADR 0012). Local é o Mailpit; em produção é o
      # SMTP do provedor, e só estas variáveis mudam.
      NOTIFICATIONS_EMAIL_ENABLED: ${NOTIFICATIONS_EMAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      # O Mailpit aceita qualquer coisa sem autenticar, então local estas três
      # ficam vazias — mas ficam *presentes*, porque uma variável documentada que
      # não chega ao contêiner é um botão que não está ligado a nada (ADR 0022).
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      NOTIFICATIONS_FROM_EMAIL: ${NOTIFICATIONS_FROM_EMAIL:-portal@portallabs.local}
      NOTIFICATIONS_FROM_NAME: ${NOTIFICATIONS_FROM_NAME:-Portal Labs}
      # Fonte da verdade do status (ADR 0006). O seed entra por `sync_snapshot`
      # direto, então a stack local sobe sem estas — o que é justamente o motivo
      # de elas terem passado despercebidas.
      BIAHFLOW_BASE_URL: ${BIAHFLOW_BASE_URL:-http://localhost:19000/api/v1}
      BIAHFLOW_READ_TOKEN: ${BIAHFLOW_READ_TOKEN:-}
      BIAHFLOW_WEBHOOK_SECRET: ${BIAHFLOW_WEBHOOK_SECRET:-}
      # Canal de WhatsApp (FDD 021, ADR 0043). Desligado por padrão: este é o
      # único canal do produto que alcança o bolso de alguém, e um default ligado
      # transformaria um erro de configuração em mensagem enviada. Aqui a API só
      # precisa do segredo do webhook de entrada — quem envia é o worker.
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
      # API de eventos dos agentes (ADR 0013). O pepper entra no HMAC que
      # substitui a chave no banco; vazio significa "nenhuma chave autentica",
      # então o local traz um valor óbvio e produção precisa do seu.
      AGENT_KEY_PEPPER: ${AGENT_KEY_PEPPER:-agent-pepper-local-only}
      AGENT_EVENTS_RATE_LIMIT: ${AGENT_EVENTS_RATE_LIMIT:-120}
      # Storage dos documentos (ADR 0014). A API grava o objeto no upload; quem
      # lê de volta para indexar é o worker, com as mesmas variáveis.
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
      # O endereço pelo qual o NAVEGADOR abre a URL assinada (ADR 0017).
      # Mesma divisão de KEYCLOAK_ISSUER/KEYCLOAK_INTERNAL_URL, e pela mesma
      # razão: a assinatura cobre o host, então ela nasce já apontando para
      # fora da rede do compose.
      STORAGE_PUBLIC_ENDPOINT_URL: ${STORAGE_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-portal-documents}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-portal-minio}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-portal-minio-local-only}
      # Vida da URL assinada da citação (ADR 0017).
      DOCUMENT_DOWNLOAD_TTL_SECONDS: ${DOCUMENT_DOWNLOAD_TTL_SECONDS:-300}
      # As mesmas do worker, e não por simetria: a API embute a *pergunta* para
      # buscar no índice que o worker embutiu. Dois embedders diferentes nos dois
      # lados seriam dois espaços vetoriais, e a recuperação devolveria ruído sem
      # nenhum erro aparecer.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-3}
      # Chat contextual (ADR 0007/0021). **Estas três faltavam aqui**, e o preço
      # foi alto: elas existem no `.env.example` desde a Fase 3 e são lidas pelo
      # `config.py`, mas nenhum compose e nenhum workflow as passava — de modo que
      # o `AnthropicResponder` nunca rodou na pilha de pé. O e2e, o navegador e
      # qualquer medição local exercitavam o respondedor offline, e uma medição de
      # carga contra isso mediria o Postgres (ADR 0022). Vazio segue significando
      # respondedor offline determinístico, o que é o padrão local.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      # Perguntas por pessoa por minuto. A ADR 0021 avisou para **não** baixar
      # este valor no compose (os specs de e2e compartilham a mesma pessoa) — o
      # aviso falava de uma variável que o compose nem lia.
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-20}
      # Conector do Google Drive (ADR 0016). Local aponta para o stub, e os dois
      # endereços diferentes não são engano: o *navegador* vai ao authorize
      # (localhost) e o *servidor* vai ao token e à API (rede interna) — a mesma
      # separação de OIDC_ISSUER/OIDC_JWKS_URL. Em produção só estas mudam.
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-portal-drive-local}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-portal-drive-local-only}
      GOOGLE_DRIVE_REDIRECT_URI: ${GOOGLE_DRIVE_REDIRECT_URI:-http://localhost:3000/admin/conhecimento/drive-callback}
      GOOGLE_OAUTH_AUTHORIZE_URL: ${GOOGLE_OAUTH_AUTHORIZE_URL:-http://localhost:19100/authorize}
      GOOGLE_OAUTH_TOKEN_URL: ${GOOGLE_OAUTH_TOKEN_URL:-http://drive-stub:19100/token}
      GOOGLE_DRIVE_API_BASE_URL: ${GOOGLE_DRIVE_API_BASE_URL:-http://drive-stub:19100/drive/v3}
      # Protege o refresh token no banco, então não pode viver no banco.
      DRIVE_TOKEN_ENCRYPTION_KEY: ${DRIVE_TOKEN_ENCRYPTION_KEY:-cG9ydGFsLWxhYnMtbG9jYWwtb25seS1kcml2ZS1rZXk}
      # A chave anterior, para a rotação não obrigar todo projeto a reconsentir.
      DRIVE_TOKEN_ENCRYPTION_KEY_PREVIOUS: ${DRIVE_TOKEN_ENCRYPTION_KEY_PREVIOUS:-}
    ports:
      - "8000:8000"
    # Prontidão, não vivacidade (ADR 0018): `/health` sempre diria "ok", porque
    # não toca em nada. `/health/ready` fala com o Postgres e com o Redis, que é
    # a diferença entre "o processo subiu" e "dá para mandar tráfego".
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=4).status == 200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./apps/api
    command: celery -A portal_api.worker.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://portal_app:portal_app_local_only@postgres:5432/portal}
      DATABASE_SYSTEM_URL: ${DATABASE_SYSTEM_URL:-postgresql+psycopg://portal_system:portal_system_local_only@postgres:5432/portal}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DEMO_MODE: ${DEMO_MODE:-false}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # É o worker que manda o e-mail; a API só enfileira (ADR 0012).
      NOTIFICATIONS_EMAIL_ENABLED: ${NOTIFICATIONS_EMAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      NOTIFICATIONS_FROM_EMAIL: ${NOTIFICATIONS_FROM_EMAIL:-portal@portallabs.local}
      PORTAL_WEB_URL: ${PORTAL_WEB_URL:-http://localhost:3000}
      # Varredura antes de indexar (ADR 0017). Vazio = veredito `skipped`, e
      # nunca `clean` — o caminho sem ClamAV ainda reconhece o EICAR, que é o
      # que permite ao e2e provar a rejeição sem antivírus no compose.
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      # Retenção (ADR 0017): a poda e o expurgo rodam aqui, sob portal_system.
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_NOTIFICATION_DAYS: ${RETENTION_NOTIFICATION_DAYS:-180}
      RETENTION_AGENT_EVENT_DAYS: ${RETENTION_AGENT_EVENT_DAYS:-730}
      RETENTION_CONVERSATION_DAYS: ${RETENTION_CONVERSATION_DAYS:-365}
      # Canal de WhatsApp (FDD 021, ADR 0043): quem envia é este serviço. Sem
      # token e sem phone number id, `is_enabled` responde não e a task sai sem
      # fazer nada — a flag sozinha não liga o canal, de propósito.
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_API_BASE: ${WHATSAPP_API_BASE:-https://graph.facebook.com/v21.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-portal_aviso}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-pt_BR}
      # A varredura roda no beat, mas quem executa a task é este serviço — e o
      # intervalo entra aqui também porque a task é a mesma nos dois caminhos.
      WHATSAPP_SWEEP_INTERVAL_SECONDS: ${WHATSAPP_SWEEP_INTERVAL_SECONDS:-900}
      # Teto de frequência de contato (ADR 0042), compartilhado por todo canal
      # que sai — hoje o WhatsApp, amanhã a pesquisa da FDD 022.
      CONTACT_WINDOW_DAYS: ${CONTACT_WINDOW_DAYS:-7}
      CONTACT_CAP_PER_WINDOW: ${CONTACT_CAP_PER_WINDOW:-3}
      # Teto de horário (FDD 021). Quem decide adiar é o **remetente**, e o
      # remetente é este serviço: o beat não precisa destas duas. Fuso fixo em
      # America/Sao_Paulo, sem variável — a ADR 0026 decidiu que fuso não é
      # configurável, e uma variável aqui seria um segundo lugar decidindo isso.
      CONTACT_QUIET_HOURS_START: ${CONTACT_QUIET_HOURS_START:-21}
      CONTACT_QUIET_HOURS_END: ${CONTACT_QUIET_HOURS_END:-8}
      # Ingestão dos documentos (ADR 0014): é aqui que o arquivo vira texto,
      # chunk e embedding. Sem VOYAGE_API_KEY o embedder é o offline
      # determinístico, e a stack local indexa sem chave nenhuma.
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-portal-documents}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-portal-minio}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-portal-minio-local-only}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-3}
      # O worker é quem fala com o Drive de verdade: a API só monta a URL de
      # consentimento e troca o código (ADR 0016).
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-portal-drive-local}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-portal-drive-local-only}
      GOOGLE_DRIVE_REDIRECT_URI: ${GOOGLE_DRIVE_REDIRECT_URI:-http://localhost:3000/admin/conhecimento/drive-callback}
      GOOGLE_OAUTH_TOKEN_URL: ${GOOGLE_OAUTH_TOKEN_URL:-http://drive-stub:19100/token}
      GOOGLE_DRIVE_API_BASE_URL: ${GOOGLE_DRIVE_API_BASE_URL:-http://drive-stub:19100/drive/v3}
      DRIVE_TOKEN_ENCRYPTION_KEY: ${DRIVE_TOKEN_ENCRYPTION_KEY:-cG9ydGFsLWxhYnMtbG9jYWwtb25seS1kcml2ZS1rZXk}
      # A chave anterior, para a rotação não obrigar todo projeto a reconsentir.
      DRIVE_TOKEN_ENCRYPTION_KEY_PREVIOUS: ${DRIVE_TOKEN_ENCRYPTION_KEY_PREVIOUS:-}
      DRIVE_SYNC_ENABLED: ${DRIVE_SYNC_ENABLED:-true}
      DRIVE_SYNC_INTERVAL_SECONDS: ${DRIVE_SYNC_INTERVAL_SECONDS:-900}
    # `inspect ping` fala com **este** worker pela fila de controle e espera o
    # pong: prova que ele está consumindo, não só que o processo existe. Um
    # worker vivo que parou de consumir é a falha que mais custa a aparecer.
    healthcheck:
      test:
        - CMD-SHELL
        - "celery -A portal_api.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 8 > /dev/null"
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 30s
    depends_on:
      api-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # O agendador do sync do Drive (ADR 0016). Serviço separado do worker porque o
  # beat **é singleton**: duas réplicas significam ticks duplicados. A guarda de
  # sobreposição em `_claim_drive_sync` faz o segundo sync virar no-op, mas contar
  # com ela no caso normal seria desenhar para o acidente.
  beat:
    build:
      context: ./apps/api
    command: >
      celery -A portal_api.worker.celery_app beat --loglevel=INFO
      --schedule=/tmp/celerybeat-schedule
    deploy:
      replicas: 1
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://portal_app:portal_app_local_only@postgres:5432/portal}
      DATABASE_SYSTEM_URL: ${DATABASE_SYSTEM_URL:-postgresql+psycopg://portal_system:portal_system_local_only@postgres:5432/portal}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DRIVE_SYNC_ENABLED: ${DRIVE_SYNC_ENABLED:-true}
      DRIVE_SYNC_INTERVAL_SECONDS: ${DRIVE_SYNC_INTERVAL_SECONDS:-900}
      # O beat lê isto para montar o agendamento; quem executa a poda e o
      # expurgo é o worker (ADR 0017).
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-86400}
      # A varredura do canal de WhatsApp (FDD 021), pelo mesmo motivo. **Duas
      # variáveis e não as cinco do canal**, que é o conjunto mínimo para montar
      # a agenda: a condição da entrada é a flag e o intervalo é o tick. O token
      # e o phone number id ficariam de fora ainda que a condição fosse
      # `whatsapp.is_enabled` — não se monta credencial de fornecedor num
      # contêiner que não fala com fornecedor —, e o template, o segredo do
      # webhook e o teto de horário são de quem envia e de quem recebe, não de
      # quem agenda.
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_SWEEP_INTERVAL_SECONDS: ${WHATSAPP_SWEEP_INTERVAL_SECONDS:-900}
    # **Sem healthcheck, de propósito** (ADR 0018). O tick mais curto do beat é
    # de 15 minutos e o mais longo é diário: qualquer sonda barata aqui — o
    # processo existe, o arquivo de agenda existe — responderia "saudável" para
    # um beat que parou de agendar, e um check que sempre passa é pior que
    # nenhum. É a mesma regra da ADR 0017 sobre o antivírus ausente: não afirmar
    # o que não se verificou. O sinal de verdade é o alerta por ausência —
    # nenhum `task.started` com `root=beat` dentro de duas vezes o intervalo
    # (`docs/runbooks/alerts.md`).
    depends_on:
      api-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Google Drive de mentira, só para a stack local e o e2e (ADR 0016). Mesma
  # imagem da API — nenhum build novo — e a única forma de provar o conector ponta
  # a ponta sem credencial do Google.
  drive-stub:
    build:
      context: ./apps/api
    command: uvicorn portal_api.devtools.drive_stub:app --host 0.0.0.0 --port 19100
    ports:
      - "19100:19100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:19100/drive/v3/about')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # BFF → FastAPI, server-side (não expor como NEXT_PUBLIC_/VITE_). O padrão é
      # o nome do serviço na rede do compose; a homologação sobrescreve quando a
      # API não é vizinha de rede.
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      # Auth.js: o cookie de sessão é cifrado com AUTH_SECRET e guarda o access
      # token, que nunca chega ao navegador (ADR 0010).
      AUTH_SECRET: ${AUTH_SECRET:-portal_auth_local_only}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_KEYCLOAK_ID: ${AUTH_KEYCLOAK_ID:-portal-web}
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET:-portal-web-local-only}
      # Público (para onde o navegador é mandado) e interno (por onde o BFF
      # troca o código por token) — dois endereços do mesmo Keycloak.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/portal-local}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080/realms/portal-local}
    ports:
      - "3000:3000"
    # `/login` é a única rota que o `proxy.ts` deixa passar sem sessão, então é
    # a única que serve de sonda sem forjar um cookie.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_started
      # Com login real, o web no ar antes do Keycloak significa primeiro acesso
      # quebrado — o code exchange acontece no servidor, na subida da página.
      keycloak:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
