name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  api-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal_local_only
          POSTGRES_DB: portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      # One URL per Postgres role (ADR 0010). DATABASE_URL is the request path
      # and must stay on portal_app, the role the RLS policies apply to.
      DATABASE_URL: postgresql+psycopg://portal_app:portal_app_ci@localhost:5432/portal
      DATABASE_SYSTEM_URL: postgresql+psycopg://portal_system:portal_system_ci@localhost:5432/portal
      DATABASE_MIGRATION_URL: postgresql+psycopg://portal_migrator:portal_migrator_ci@localhost:5432/portal
      DATABASE_ADMIN_URL: postgresql+psycopg://portal_admin:portal_admin_ci@localhost:5432/portal
    steps:
      - uses: actions/checkout@v4
      # Service containers start before the checkout, so the bootstrap cannot be
      # mounted as a volume the way compose does it — same script, run as a step.
      - name: Create the Postgres roles
        run: |
          psql "postgresql://portal:portal_local_only@localhost:5432/portal" \
            -v ON_ERROR_STOP=1 \
            -v app_password=portal_app_ci \
            -v system_password=portal_system_ci \
            -v migrator_password=portal_migrator_ci \
            -v admin_password=portal_admin_ci \
            -f infra/postgres/bootstrap/roles.sql
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r apps/api/requirements-dev.txt
      # pytest's conftest migrates the database to head (creating the portal
      # schema) before the integration tests run.
      - run: PYTHONPATH=apps/api/src pytest apps/api/tests

  local-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build

  # The only job that boots Keycloak: it is the one thing the other levels
  # cannot prove — browser → realm → BFF callback → dashboard. Non-blocking for
  # now, while the stack's boot time settles in CI.
  e2e-login:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Boot the local stack
        run: |
          cp .env.example .env
          docker compose up -d --build web
      - name: Wait for the portal
        run: |
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/login && exit 0
            sleep 5
          done
          docker compose logs --tail 50
          exit 1
      - run: npm run test:e2e
      - if: failure()
        run: docker compose logs --tail 100

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, python
      - uses: github/codeql-action/analyze@v3
