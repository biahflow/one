# Atualização de dependências por robô (ADR 0023).
#
# É o mecanismo **secundário**, e a ordem importa: quem reprova é o job
# `dependency-audit` do CI, que roda `scripts/audit.mjs` a cada push. O
# Dependabot só abre o PR que conserta.
#
# A razão de não ser o contrário está documentada ao lado do `codeql` em
# `ci.yml`: *version updates* funcionam em repositório privado sem Advanced
# Security, mas os **alertas de segurança** dependem da mesma configuração de
# repositório que o code scanning não tem. Confiar no alerta seria confiar num
# controle que este repositório não pode ligar — foi como o aviso do `next`
# atravessou duas fatias sem ninguém ver.
#
# Semanal e com teto baixo de PRs abertos de propósito: um robô que abre vinte
# PRs por semana treina a equipe a fechá-los sem ler, que é a forma de este
# mecanismo virar o oposto do que é.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # `next`, `eslint-config-next` e os tipos do React andam juntos ou não
      # andam: subir um sem o outro reprova no `npm run lint` ou no build. Um PR
      # por pacote produziria três vermelhos que só ficam verdes quando os três
      # forem mergeados, e ninguém revisa nessa ordem.
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: pip
    directory: "/apps/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Mesmo argumento, e é o par que esta fatia mediu: o pin do `fastapi` é na
      # prática o pin do `starlette`, então subir um sem o outro ou não resolve o
      # aviso ou não instala.
      fastapi:
        patterns:
          - "fastapi"
          - "starlette"
          - "python-multipart"

  # As actions também são dependência, e executam com o token do workflow — a
  # única das quatro que roda *dentro* do CI em vez de ser auditada por ele.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # As duas imagens base. `node:24.12.0-alpine` e a da API estão fixadas em
  # versão exata (ADR 0022), o que é bom para reprodutibilidade e péssimo para
  # patch de segurança do sistema operacional: sem alguém subindo o pin, a imagem
  # congela na CVE do dia em que foi escolhida.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/apps/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
