name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest
    # Sem teto, um processo órfão segura o job até as 6h do runner — foi o que
    # aconteceu nos merges da Fase 3 e da Fase 4. E o run só publica log quando
    # termina, então o job travado esconde a causa da falha dos outros.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  api-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal_local_only
          POSTGRES_DB: portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      # One URL per Postgres role (ADR 0010). DATABASE_URL is the request path
      # and must stay on portal_app, the role the RLS policies apply to.
      DATABASE_URL: postgresql+psycopg://portal_app:portal_app_ci@localhost:5432/portal
      DATABASE_SYSTEM_URL: postgresql+psycopg://portal_system:portal_system_ci@localhost:5432/portal
      DATABASE_MIGRATION_URL: postgresql+psycopg://portal_migrator:portal_migrator_ci@localhost:5432/portal
      DATABASE_ADMIN_URL: postgresql+psycopg://portal_admin:portal_admin_ci@localhost:5432/portal
    steps:
      - uses: actions/checkout@v7
      # Service containers start before the checkout, so the bootstrap cannot be
      # mounted as a volume the way compose does it — same script, run as a step.
      - name: Create the Postgres roles
        run: |
          psql "postgresql://portal:portal_local_only@localhost:5432/portal" \
            -v ON_ERROR_STOP=1 \
            -v app_password=portal_app_ci \
            -v system_password=portal_system_ci \
            -v migrator_password=portal_migrator_ci \
            -v admin_password=portal_admin_ci \
            -f infra/postgres/bootstrap/roles.sql
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r apps/api/requirements-dev.txt
      # pytest's conftest migrates the database to head (creating the portal
      # schema) before the integration tests run.
      #
      # `CI` já vem definida pelo runner, e desde a ADR 0020 ela muda o
      # significado de um pulo: um teste que pularia por falta de banco aqui
      # **falha**, porque este job tem um. `test_backup_restore.py` sai daqui
      # porque exige storage e as senhas dos papéis — ele tem job próprio.
      - run: >-
          PYTHONPATH=apps/api/src pytest apps/api/tests
          --ignore=apps/api/tests/test_backup_restore.py

  # O job que a FDD 013 pediu e não existia: até aqui o par backup/restore só
  # rodava quando alguém lembrava de rodar, e as três asserções que dão sentido
  # a ele (policies de volta, GRANT de coluna ainda de coluna, uma organização
  # sem ver a outra) **pulavam em silêncio** em toda execução do CI, por falta
  # de duas variáveis. Job próprio porque o par precisa de coisas que o resto da
  # suíte não precisa — storage, as senhas dos quatro papéis e um cliente do
  # Postgres tão novo quanto o servidor — e porque um backup que quebrou deve
  # ficar vermelho sozinho, sem se confundir com um teste de unidade qualquer.
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal_local_only
          POSTGRES_DB: portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://portal_app:portal_app_ci@localhost:5432/portal
      DATABASE_SYSTEM_URL: postgresql+psycopg://portal_system:portal_system_ci@localhost:5432/portal
      DATABASE_MIGRATION_URL: postgresql+psycopg://portal_migrator:portal_migrator_ci@localhost:5432/portal
      DATABASE_ADMIN_URL: postgresql+psycopg://portal_admin:portal_admin_ci@localhost:5432/portal
      # O `restore.sh` cria um banco descartável e roda o `roles.sql` nele, e
      # para isso precisa do superusuário do cluster e da senha de cada papel —
      # papel é objeto de cluster e não vem no `pg_dump -n portal` (ADR 0019).
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_local_only
      POSTGRES_APP_PASSWORD: portal_app_ci
      POSTGRES_SYSTEM_PASSWORD: portal_system_ci
      POSTGRES_MIGRATOR_PASSWORD: portal_migrator_ci
      POSTGRES_ADMIN_PASSWORD: portal_admin_ci
      STORAGE_ENDPOINT_URL: http://localhost:9000
      STORAGE_ACCESS_KEY: portal-minio
      STORAGE_SECRET_KEY: portal-minio-local-only
    steps:
      - uses: actions/checkout@v7
      # MinIO não entra como `services:` porque a imagem precisa do comando
      # `server /data`, e um service container não aceita comando.
      - name: Boot MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=portal-minio \
            -e MINIO_ROOT_PASSWORD=portal-minio-local-only \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:9000/minio/health/live && break
            sleep 2
          done
      - name: Create the Postgres roles
        run: |
          psql "postgresql://portal:portal_local_only@localhost:5432/portal" \
            -v ON_ERROR_STOP=1 \
            -v app_password=portal_app_ci \
            -v system_password=portal_system_ci \
            -v migrator_password=portal_migrator_ci \
            -v admin_password=portal_admin_ci \
            -f infra/postgres/bootstrap/roles.sql
      # `pg_dump` recusa um servidor mais novo que ele, e o cliente do runner
      # não é garantido. Sem este passo o teste pularia — e desde a ADR 0020 um
      # pulo aqui é falha, que é o ponto: o job diz o que lhe falta em vez de
      # ficar verde sem provar nada.
      - name: Ensure a PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pg_dump --version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r apps/api/requirements-dev.txt
      # O MinIO recém-subido não tem bucket, e `backup.sh` **falha** ao listar
      # um bucket inexistente — o que está certo: um backup que não consegue ler
      # o storage não é um backup. Quem cria é a função que o `storage.py` já
      # tem, e cujo docstring justamente recusou "um serviço `mc` a mais".
      - name: Ensure the bucket
        run: |
          PYTHONPATH=apps/api/src python -c "
          from portal_api import storage
          from portal_api.config import get_settings
          storage.ensure_bucket(get_settings())
          "
      - run: PYTHONPATH=apps/api/src pytest apps/api/tests/test_backup_restore.py -v

  # A infraestrutura como código, sem credencial (ADR 0048). O `infra-hml.yml`
  # **fica**, e os dois não se sobrepõem — a mesma distinção que o
  # `dependency-audit` e o `dependency-review` têm entre si (ADR 0023): lá se
  # planeja contra o projeto real, aqui se prova que o HCL parseia e tipa.
  #
  # A razão de existir é concreta e não hipotética: o `ci.yml` não tocava
  # Terraform, e o `infra-hml.yml` se autentica por `vars.WIF_PROVIDER` — que é
  # criado **pelo próprio Terraform** (ADR 0046). Enquanto aquela variável não
  # existir, uma mudança de infraestrutura entra num PR sem prova nenhuma de que
  # sequer parseia. `-backend=false` é o que torna isto possível: instala os
  # providers sem tocar no bucket de estado.
  #
  # **`infra-quality` e não `terraform`**, que era o nome na primeira versão: o
  # job do `infra-hml.yml` já se chama `terraform`, e os dois aparecem lado a lado
  # na lista de checks de um PR que toque `infra/terraform/**`. Com o mesmo nome,
  # um verde e um vermelho, "qual deles falhou" deixa de ter resposta olhando a
  # lista — e o que falha por falta de `WIF_PROVIDER` é justamente o que **não**
  # é defeito do PR. Medido no PR #20, onde os dois apareceram como `terraform`.
  infra-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      # Sobre a árvore inteira, como o `infra-hml.yml` faz: um módulo mal
      # formatado reprova lá, e descobrir isso só no PR de infraestrutura é tarde.
      - run: terraform -chdir=infra/terraform/ambientes/hml fmt -check -recursive ../..

      # **Todo ambiente que existe, descoberto e não digitado.** Sem credencial nenhuma,
      # então este é o único gate de Terraform que dá para reproduzir localmente e o
      # único que roda em todo PR — e são justamente os diretórios novos que mais
      # precisam dele.
      #
      # A lista era `hml hml-biahflow hml-portal`, escrita à mão. O `hml-portal` saiu
      # em 13/08/2026 junto com o state dele; a matriz do `infra-hml.yml` foi atualizada
      # e **esta linha não**, então o laço passou a apontar para um diretório que não
      # existe e o job reprovava com `chdir: no such file or directory` — vermelho que
      # não fala de Terraform nenhum. É o defeito das ADRs 0033 e 0035 outra vez, e a
      # correção é a mesma: derivar do artefato em vez de redigitá-lo. Acrescentar ou
      # remover um ambiente agora não deixa este laço para trás.
      #
      # `-backend=false` instala os providers sem tocar no bucket de estado. O preço,
      # declarado: sem backend não há `terraform_remote_state`, então o `validate` dos
      # produtos prova que os módulos resolvem e que os tipos casam, e **não** prova que
      # as saídas que eles leem da fundação existem. Quem prova isso é o `plan` do
      # `infra-hml.yml`, que tem credencial.
      - run: |
          for d in infra/terraform/ambientes/*/; do
            echo "== ${d}"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done

  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose build

      # O ambiente de homologação é definido em código, e um arquivo de compose
      # que ninguém interpreta apodrece sem avisar (ADR 0022). Duas asserções,
      # nesta ordem, porque a primeira é a que dá sentido à segunda.

      # 1. Sem segredos, o override **recusa**. É a propriedade central da
      #    fatia: todo `${VAR}` do compose base tem default local, então um
      #    `.env` incompleto subiria verde com a senha do `.env.example`.
      - name: o override de homologação recusa subir sem segredos
        run: |
          if docker compose --env-file /dev/null \
               -f docker-compose.yml -f docker-compose.homolog.yml config >/dev/null 2>&1; then
            echo "::error::o override de homologação aceitou uma configuração sem segredos"
            exit 1
          fi

      # 2. Com o template completo, ele valida. Sem esta, a asserção acima
      #    passaria também para um arquivo sintaticamente quebrado.
      - name: o override de homologação valida com o template
        run: |
          docker compose --env-file .env.homolog.example \
            -f docker-compose.yml -f docker-compose.homolog.yml config --quiet

  # The only job that boots Keycloak: it is the one thing the other levels
  # cannot prove — browser → realm → BFF callback → dashboard.
  #
  # A pilha **completa** precisa subir: sem o `worker` nada é varrido nem
  # indexado, e os specs de documentos, Drive e notificações esperariam um selo
  # que nunca ia aparecer. `drive-stub` e `mailpit` são a mesma história.
  #
  # **Deixou de ser `continue-on-error` na ADR 0020**, junto com a guarda
  # `dockerAvailable()` dos specs, que agora falha em vez de pular quando `CI`
  # está definida. Eram duas metades do mesmo defeito: um job que não podia
  # reprovar, com specs que se auto-pulavam — o comentário que vivia aqui já
  # dizia que isso "fica verde sem provar nada, que é pior do que vermelho", e
  # mesmo assim era o estado. Se o e2e se mostrar instável, a saída é consertar
  # ou apagar o spec; voltar a flag é desligar a única prova que resta.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Boot the local stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for the portal
        run: |
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/login && exit 0
            sleep 5
          done
          docker compose logs --tail 50
          exit 1
      - run: npm run test:e2e

      # O harness de carga, rodado curto e **sem** chave (ADR 0022). Não é uma
      # medição e o relatório diz isso sozinho: `is_homologation: false` e uma
      # nota explicando que aquilo descreve o runner. O que este passo prova é
      # que a ferramenta ainda funciona ponta a ponta — token do realm, chamada
      # autenticada, razão de consumo, relatório —, que é a lição que a ADR 0021
      # aprendeu do jeito caro com o `AnthropicResponder` que nenhum teste
      # executava. O `--budget-usd` é dispensável justamente porque não há chave:
      # sem provedor, nada custa.
      - name: o harness de carga ainda roda ponta a ponta
        # As duas URLs são explícitas porque este passo roda **no host do
        # runner**, e não num contêiner: o `.env` copiado do `.env.example` no
        # passo de subida aponta para `postgres:5432`, que é o nome de serviço do
        # Compose e só resolve de dentro da rede dele. A porta está publicada,
        # então do host o mesmo banco é `localhost:5432`. Variável de ambiente
        # ganha do `.env` no pydantic-settings, que é o que faz isto funcionar
        # sem tocar no arquivo que os contêineres leem.
        env:
          DATABASE_URL: postgresql+psycopg://portal_app:portal_app_local_only@localhost:5432/portal
          DATABASE_SYSTEM_URL: postgresql+psycopg://portal_system:portal_system_local_only@localhost:5432/portal
        run: |
          pip install -r apps/api/requirements.txt
          PYTHONPATH=apps/api/src python scripts/loadtest.py \
            --duration 15 --out /tmp/carga.json
          python - <<'PY'
          import json, sys
          report = json.load(open("/tmp/carga.json"))
          if report["requests"]["ok"] < 1:
              sys.exit(f"o harness não obteve nenhuma resposta: {report['requests']}")
          if report["requests"]["errors"]:
              sys.exit(f"o harness viu erros de transporte: {report['requests']}")
          # A honestidade do relatório é parte do que se está testando: se ele
          # deixar de declarar que não é homologação, o próximo a citá-lo não vai
          # saber.
          assert report["is_homologation"] is False
          assert any("não é homologação" in note for note in report["notes"])
          PY

      # O instrumento de comando/hora, pelo mesmo argumento acima e com a mesma
      # ressalva (ADR 0048): **não é a medição**. A da ADR 0045 é contra o Upstash,
      # leva quinze minutos e depende do ambiente que veio medir; esta janela de 20 s
      # contra o Redis do compose prova que a ferramenta ainda fala com um broker, lê
      # o contador e monta o relatório. O que se afirma é justamente a honestidade
      # dele: que ele **se declara** fora do alvo em vez de deixar o número passar
      # por medição.
      - name: o instrumento de comando/hora ainda roda ponta a ponta
        env:
          REDIS_RATE_URL: redis://localhost:6379/0
        run: |
          PYTHONPATH=apps/api/src python scripts/redis_rate.py \
            --duration 20 --out /tmp/redis.json
          python - <<'PY'
          import json, sys
          report = json.load(open("/tmp/redis.json"))
          if not report["commands"]["info_available"]:
              sys.exit("o instrumento não conseguiu ler INFO do Redis do compose")
          if report["commands"]["per_hour"] is None:
              sys.exit(f"nenhum número foi produzido: {report['commands']}")
          assert report["is_upstash"] is False
          assert any("não é a medição que a ADR 0045 pede" in n for n in report["notes"])
          # A nota que impede o pior uso do relatório: dividir o número do compose
          # por um fator qualquer e citá-lo como estimativa de HML.
          assert any("não extrapola" in n for n in report["notes"])
          PY
      - if: failure()
        run: docker compose logs --tail 100

  # O portão que faltava (ADR 0023). O `dependency-review` abaixo **fica**, e os
  # dois não se sobrepõem: ele olha o *diff* de dependências de um PR e pega a
  # biblioteca ruim entrando; este pergunta o que já está instalado. Era a
  # metade que ninguém fazia, e foi assim que nove avisos do `next`, sete do
  # `starlette` e seis do `python-multipart` conviveram meses com um CI de seis
  # portões — nenhum deles diff de PR nenhum.
  #
  # Job próprio pelo argumento do `backup-restore`: precisa dos dois toolchains
  # ao mesmo tempo, e uma dependência vulnerável merece o próprio vermelho em vez
  # de se confundir com um lint quebrado dentro do `web-quality`.
  #
  # Em `push` **e** `pull_request`, ao contrário do `dependency-review`: um aviso
  # novo não chega por pull request, chega porque alguém o publicou. Restringir a
  # PR deixaria `main` sem cobertura exatamente entre as entregas, que é quando o
  # intervalo é maior.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      # Só o `pip-audit`: ele resolve a árvore a partir do arquivo de
      # requisitos e não precisa do ambiente instalado. Instalar tudo aqui
      # duplicaria o `api-quality` e faria o resultado depender do que já
      # estivesse no runner — que é justamente o modo de falha que o pin direto
      # do `starlette` fecha (ver `apps/api/requirements.txt`).
      - run: pip install "$(grep '^pip-audit==' apps/api/requirements-dev.txt)"
      - run: npm run audit

  # **Desligado por variável desde 17/08/2026, e pela mesma razão do `codeql`
  # abaixo: repositório privado.** Ao migrar para a org `biahflow` este repo
  # passou a privado, e ali a API de dependency review exige Advanced Security —
  # o job reprova com "Dependency review is not supported on this repository",
  # que é sobre o plano do repositório e não sobre as dependências do PR.
  #
  # O que se perde está declarado: some o portão sobre o **diff** do PR, isto é,
  # a biblioteca ruim *entrando*. Fica o `dependency-audit` acima, que pergunta o
  # que já está instalado e roda em `push` e `pull_request` — a metade que
  # importa mais, e a que já pegava o que ninguém via. Não é substituto: os dois
  # nunca se sobrepuseram, e é por isso que o job continua aqui em vez de ser
  # apagado. Ligar é criar `DEPENDENCY_REVIEW_ENABLED=true` — o que só faz
  # sentido depois de contratar Advanced Security ou de o repo voltar a público.
  dependency-review:
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4

  # **Desligado, e não por escolha de qualidade.** O `analyze` falha com "Code
  # scanning is not enabled for this repository": é configuração do repositório
  # (Settings → Code security), não do workflow, e em repositório privado não é
  # gratuita. Enquanto não for habilitada, o job não tem como passar.
  #
  # Fica **desligado por variável** em vez de comentado: o bloco continua
  # revisável, as permissões abaixo já estão corretas, e ligar é criar a variável
  # de repositório `CODE_SCANNING_ENABLED=true` (Settings → Secrets and variables
  # → Actions → Variables). Nenhuma outra mudança é necessária.
  #
  # Um job comentado apodrece — ninguém revisa o que o YAML não executa; e um job
  # vermelho permanente é pior, porque treina quem lê o CI a ignorar vermelho.
  # Pulado é o único dos três estados que diz a verdade.
  codeql:
    if: vars.CODE_SCANNING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # As três, e nenhuma é dispensável: um bloco `permissions` de job
      # **substitui** o global em vez de somar a ele, então declarar só
      # `security-events` zerava o resto. Cada uma some de um jeito diferente,
      # e é por isso que vale nomeá-las:
      #
      # - sem `contents`, o `actions/checkout` responde "repository not found" —
      #   que num repositório privado é o que o GitHub diz a quem não pode ler;
      # - sem `actions`, o `analyze` falha com "Resource not accessible by
      #   integration" ao consultar o próprio run, e é exigência documentada do
      #   CodeQL em repositório privado;
      # - `security-events` é o envio do SARIF.
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, python
      - uses: github/codeql-action/analyze@v3
