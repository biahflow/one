# O Terraform de HML, em workflow próprio.
#
# Separado do `deploy-hml.yml` de propósito: mudar a forma da infraestrutura e
# trocar a imagem de um serviço têm raios de dano diferentes. Um `apply` pode
# recriar rede, VM e conector; um deploy troca uma revisão. Se o deploy rodasse
# `apply`, um push de rotina passaria a poder derrubar a rede.
#
# Por isso: `plan` automático em PR que toca a infraestrutura, `apply` só quando
# uma pessoa manda.
#
# **Três states desde a ADR 0051**, e a matriz existe para que o `plan` de um produto
# não dependa do outro. `fail-fast: false` porque um plano vermelho no portal do
# cliente não torna menos útil ver o do Biahflow — e `max-parallel: 1` porque os três
# compartilham o bucket de estado e a ordem de leitura importa: a fundação primeiro,
# já que os produtos leem as saídas dela.
name: infra-hml

on:
  pull_request:
    paths: ["infra/terraform/**"]
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Aplicar de verdade (senão só planeja)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # `hml-portal` saiu em 13/08/2026 junto com o state dele: o portal do cliente
        # espera quem o opere. Voltar é recriar o diretório e reacrescentar a entrada
        # aqui — o histórico guarda os dois.
        ambiente: [hml, hml-biahflow]
    env:
      DIRETORIO: infra/terraform/ambientes/${{ matrix.ambiente }}

      # **A borda virou Cloudflare (ADR 0053) e a credencial não veio junto.** O
      # `versions.tf` do `hml` declara `provider "cloudflare" {}` e diz por que o token
      # entra pelo ambiente e não por variável — variável aparece em plano, em state e
      # em log de CI. Só que nenhum workflow o passava, então o `plan` chegava à API sem
      # header de autenticação e morria em `400 … Missing X-Auth-Key, X-Auth-Email or
      # Authorization headers` — que parece problema de conta e é falta de fiação.
      #
      # Vazio para `hml-biahflow`, que não tem provider Cloudflare, e isso é de graça:
      # o provider só é configurado onde é declarado.
      #
      # As três permissões que o token precisa estão medidas uma a uma em
      # `ambientes/hml/cloudflare.tf`, e duas delas falham de forma enganosa quando
      # faltam — `Zone → Zone → Read` ausente responde "0 found", e não "negado".
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # **Conta própria, diferente da do deploy.** A `hml-deploy` tem as quatro
      # permissões de trocar revisão e publicar imagem, e nenhuma delas cria uma
      # sub-rede, uma conta de serviço ou um pool de WIF — com ela este workflow
      # falhava em `permission denied` no primeiro recurso. A `hml-infra` tem o
      # que um `apply` exige, que é quase o projeto inteiro, e é justamente por ser
      # tanto que ela não pode ser a conta que roda a cada push na `main`.
      - uses: google-github-actions/auth@v2
        with:
          project_id: biahflow-hml
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: hml-infra@biahflow-hml.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      # `../..` a partir de qualquer um dos três alcança a árvore inteira — o formato
      # é do repositório, não do ambiente, e conferi-lo três vezes é barato.
      - name: Formato
        run: terraform -chdir=$DIRETORIO fmt -check -recursive ../..

      - run: terraform -chdir=$DIRETORIO init -input=false

      - run: terraform -chdir=$DIRETORIO validate

      # **Sem `-var tag_imagem`**, e a ausência é o conserto. O `ignore_changes` do
      # módulo protege a imagem do último deploy — mas só em *update*: num serviço
      # que ainda não existe, a tag literal é usada, e uma tag que não está no
      # registro faz o Cloud Run recusar a revisão. `tag_imagem` vazia significa
      # `imagem_bootstrap`, e é assim que o primeiro apply consegue criar o serviço
      # que o `deploy-hml.yml` depois atualiza.
      - name: Plano
        run: |
          terraform -chdir=$DIRETORIO plan -input=false -lock-timeout=5m -out=plano.tfplan

      - name: Aplica
        if: github.event_name == 'workflow_dispatch' && inputs.aplicar
        run: terraform -chdir=$DIRETORIO apply -input=false -lock-timeout=5m plano.tfplan
