services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-portal}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Cria portal_migrator/portal_app/portal_system e transfere a posse do schema
  # (ADR 0010). Roda a cada `up` porque ./infra/postgres/init só é executado em
  # volume novo — este serviço cobre também quem já tem banco criado.
  db-bootstrap:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-portal_local_only}
    volumes:
      - ./infra/postgres/bootstrap:/bootstrap:ro
    command: >
      psql -h postgres -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-portal}
           -v ON_ERROR_STOP=1
           -v app_password=${POSTGRES_APP_PASSWORD:-portal_app_local_only}
           -v system_password=${POSTGRES_SYSTEM_PASSWORD:-portal_system_local_only}
           -v migrator_password=${POSTGRES_MIGRATOR_PASSWORD:-portal_migrator_local_only}
           -f /bootstrap/roles.sql
    depends_on:
      postgres:
        condition: service_healthy

  # Aplica as migrações com o papel dono do schema. Antes desta fase nenhum
  # contêiner rodava alembic.
  api-migrate:
    build:
      context: ./apps/api
    restart: "no"
    command: alembic upgrade head
    environment:
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-postgresql+psycopg://portal_migrator:portal_migrator_local_only@postgres:5432/portal}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-portal-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-portal-minio-local-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local_only}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/portal
      KC_DB_USERNAME: ${POSTGRES_USER:-portal}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-portal_local_only}
      KC_DB_SCHEMA: keycloak
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./apps/api
    environment:
      # Caminho de requisição: papel sujeito à RLS (ADR 0010).
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://portal_app:portal_app_local_only@postgres:5432/portal}
      # Caminho de sistema: webhook e seed, que criam o tenant.
      DATABASE_SYSTEM_URL: ${DATABASE_SYSTEM_URL:-postgresql+psycopg://portal_system:portal_system_local_only@postgres:5432/portal}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DEMO_MODE: ${DEMO_MODE:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # O `iss` do token é o endereço que o navegador usou; o JWKS é buscado pela
      # rede interna, que é outro host (ADR 0010).
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/portal-local}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/portal-local/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-portal-api}
    ports:
      - "8000:8000"
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./apps/api
    command: celery -A portal_api.worker.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://portal_app:portal_app_local_only@postgres:5432/portal}
      DATABASE_SYSTEM_URL: ${DATABASE_SYSTEM_URL:-postgresql+psycopg://portal_system:portal_system_local_only@postgres:5432/portal}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # BFF → FastAPI, server-side (não expor como NEXT_PUBLIC_/VITE_).
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
