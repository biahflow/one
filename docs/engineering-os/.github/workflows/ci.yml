name: CI

# Esta camada é vendorizada como espelho completo dentro de cada projeto consumidor: o que
# passa aqui vira regra lá, e o que quebra aqui quebra num repositório que não pode
# consertá-lo. Os portões abaixo são os que a origem deve a seus consumidores.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Documentação, higiene e adapters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Dependências dos portões
        run: pip install --quiet pyyaml

      - name: Links de Markdown
        run: scripts/check-links.py

      - name: Artefatos gerados rastreados
        run: scripts/check-tracked-artifacts.py

      - name: Caminhos absolutos de máquina
        run: scripts/check-operator-paths.py

      - name: YAML parseável
        run: scripts/check-yaml.py

      - name: Adapters carregam o placeholder
        # Um adapter que perdeu `{{EOS_ROOT}}` já tem um caminho fixo dentro dele; o portão
        # de caminhos de máquina pega o caso absoluto, este pega o relativo.
        run: |
          for adapter in adapters/claude/CLAUDE.md adapters/codex/AGENTS.md; do
            grep -q '{{EOS_ROOT}}' "$adapter" || {
              echo "adapter sem placeholder {{EOS_ROOT}}: $adapter" >&2
              exit 1
            }
          done

      - name: Instalação renderiza sem escrever
        run: scripts/install-adapters.sh --dry-run

      - name: Testes dos checkers de conformidade
        # Os checkers leem artefato escrito à mão e decidem se ele tem a forma que os
        # contratos exigem. O risco deles não é falhar, é reprovar artefato bom: um
        # portão com falso vermelho é desligado pela primeira pessoa que o encontra.
        run: python3 -m unittest discover -s tests -q

  pull-request:
    name: Base do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: A base é main
        # Um PR baseado noutro branch de tarefa empilha a fila: um rebase no meio
        # desmonta todos, e a CI de cada um testa uma base que não existirá depois do
        # merge. Se as tarefas dependem uma da outra isso não é paralelismo, é sequência,
        # e a dependência pertence ao DAG do plano.
        run: |
          if [ "${{ github.base_ref }}" != "main" ]; then
            echo "PR baseado em '${{ github.base_ref }}', não em main." >&2
            echo "Releases e tarefas saem de main; ver workflows/worktree-execution.md." >&2
            exit 1
          fi
          echo "base: main"

  go:
    name: Biah (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: biah/go.mod
          cache-dependency-path: biah/go.sum

      - name: Formatação
        working-directory: biah
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "arquivos fora do gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        working-directory: biah
        run: go vet ./...

      - name: Build
        working-directory: biah
        run: go build ./...

      - name: Testes
        working-directory: biah
        run: go test ./...
